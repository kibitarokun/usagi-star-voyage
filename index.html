<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><title>うさぎの宇宙航路 — 3Dシューティング</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b223b'/%3E%3Cpath d='M32 8 55 51 32 42 9 51Z' fill='%238aefff'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pilot.css?v=expanded-sectors-1"></head>
<body><main class="shell">
<canvas id="game" tabindex="0" aria-label="3D宇宙シューティング。矢印キーまたはドラッグで移動"></canvas><div class="frame"></div>
<div class="hud"><div><div class="eyebrow">SCORE</div><div class="score" id="score">000000</div></div><div class="vitals"><div class="eyebrow">SHIELD</div><div class="life" id="life">◆◆◆◆◆</div></div></div>
<div class="stage"><small id="sector">STAGE 01 / 08</small><strong id="objective">8つの戦域を突破せよ</strong><div class="stage-progress"><i></i><i></i><i></i><i></i><i></i></div></div>
<div id="bossHud" class="boss hidden"><div class="boss-head"><span id="bossName"></span><span id="bossValue"></span></div><div class="track"><i id="bossFill"></i></div></div>
<section id="dialogue" class="dialogue hidden" aria-live="polite"><div class="pilot-screen"><div id="portraitArt" class="pilot-art" data-mood="normal"></div></div><div class="dialogue-copy"><div class="dialogue-speaker">USAGI <span>／ パイロット</span></div><p id="dialogueText">準備はできた！ 星の海へ出撃だ！</p></div></section>
<div class="bottom"><div class="tools"><button id="sound" aria-pressed="false">音 OFF</button><button id="pause">一時停止</button></div></div>
<div id="notice" class="notice"><small id="noticeSub"></small><strong id="noticeTitle"></strong></div><div id="stageClear" class="stage-clear hidden" aria-live="assertive"><div class="stage-clear-rays"></div><small id="stageClearLabel">STAGE 01 / 08</small><strong>STAGE CLEAR</strong><span id="stageClearNext">次の戦域へ</span></div><div id="flash"></div>
<section id="panel" class="panel"><div id="titlePilot" class="title-pilot pilot-art" data-mood="normal" aria-hidden="true"></div><div class="card"><div class="kicker" id="kicker">USAGI / STAR VOYAGE</div><h1 id="title">うさぎの<br>宇宙航路</h1><p id="description">ワープの先に待つ、8つの戦域。<br>敵編隊・迎撃艦・旗艦を突破しよう。</p><div class="journey" id="journey"><span>01 敵編隊</span><span>02 強襲隊</span><span>03 迎撃艦</span><span>04 激戦域</span><span>05 旗艦</span><span>06 星雲</span><span>07 小惑星帯</span><span>08 超旗艦</span></div><p class="controls-copy">操作：矢印キー / WASD / ドラッグで移動<br>SPACE または画面を押して射撃</p><button id="start" class="primary">出撃する</button><button id="restart" class="secondary hidden">ステージ1からやり直す</button><button id="resume" class="secondary hidden">飛行を再開</button></div></section>
<div id="error" class="error hidden" role="alert"></div></main><script type="module" src="game.mjs?v=stage-retry-1"></script></body></html>
